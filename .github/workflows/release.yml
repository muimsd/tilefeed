name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: tilefeed
            archive: tilefeed-x86_64-unknown-linux-gnu.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: tilefeed
            archive: tilefeed-aarch64-unknown-linux-gnu.tar.gz
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: tilefeed
            archive: tilefeed-aarch64-apple-darwin.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: tilefeed
            archive: tilefeed-x86_64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: tilefeed.exe
            archive: tilefeed-x86_64-pc-windows-msvc.zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install cross-compilation tools
        if: matrix.cross
        run: sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure cross-compilation
        if: matrix.cross
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: tar czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release ${{ matrix.artifact }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.artifact }} -DestinationPath ${{ matrix.archive }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  package-deb:
    name: Build .deb (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            cross: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          cargo install cargo-deb
      - name: Install cross-compilation tools
        if: matrix.cross
        run: sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Configure cross-compilation
        if: matrix.cross
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
      - name: Build .deb package
        run: cargo deb --target ${{ matrix.target }}
      - name: Rename .deb
        run: |
          DEB=$(find target/${{ matrix.target }}/debian -name '*.deb' | head -1)
          cp "$DEB" tilefeed_${{ matrix.arch }}.deb
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: tilefeed_${{ matrix.arch }}.deb
          path: tilefeed_${{ matrix.arch }}.deb

  package-rpm:
    name: Build .rpm (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          cargo install cargo-generate-rpm
      - name: Build release binary
        run: cargo build --release
      - name: Build .rpm package
        run: cargo generate-rpm
      - name: Rename .rpm
        run: |
          RPM=$(find target/generate-rpm -name '*.rpm' | head -1)
          cp "$RPM" tilefeed-x86_64.rpm
      - name: Upload .rpm
        uses: actions/upload-artifact@v4
        with:
          name: tilefeed-x86_64.rpm
          path: tilefeed-x86_64.rpm

  release:
    name: Create Release
    needs: [build, package-deb, package-rpm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*

  update-manifests:
    name: Update Package Manifests
    needs: release
    # Prereleases must not overwrite the manifests that stable installs follow
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
      - name: Update all package manifests
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/update-manifests.sh "$VERSION"
      - name: Commit and push manifest updates
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/tilefeed.rb bucket/tilefeed.json packaging/
          if git diff --cached --quiet; then
            echo "::error::No manifest changed for v${VERSION} — the update step did nothing"
            exit 1
          fi
          git commit -m "Update package manifests for v${VERSION}"
          git push
      - name: Update Homebrew tap
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/muimsd/homebrew-tilefeed.git" tap
          cp Formula/tilefeed.rb tap/Formula/tilefeed.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/tilefeed.rb
          # A no-op here is fine: the tap may already carry this formula
          git diff --cached --quiet || git commit -m "Update tilefeed to v${VERSION}"
          git push

