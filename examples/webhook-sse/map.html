<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Tilefeed Live Map — MapLibre + SSE</title>
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
    <style>
        body { margin: 0; }
        #map { width: 100vw; height: 100vh; }
        #status {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #0f0;
            padding: 10px 16px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            z-index: 10;
            max-width: 350px;
        }
        #status .event {
            margin-top: 6px;
            padding: 4px 0;
            border-top: 1px solid rgba(255,255,255,0.2);
        }
        #status .connected { color: #0f0; }
        #status .disconnected { color: #f44; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="status">
        <div id="sse-status" class="disconnected">SSE: connecting...</div>
        <div id="events"></div>
    </div>

    <script>
        // ── Config ──────────────────────────────────────────────
        const TILE_SERVER = 'http://localhost:3000';
        const SOURCE_NAME = 'parks';

        // ── Map ─────────────────────────────────────────────────
        const map = new maplibregl.Map({
            container: 'map',
            style: {
                version: 8,
                sources: {
                    [SOURCE_NAME]: {
                        type: 'vector',
                        tiles: [`${TILE_SERVER}/${SOURCE_NAME}/{z}/{x}/{y}.pbf`],
                        minzoom: 0,
                        maxzoom: 14,
                    },
                },
                layers: [
                    {
                        id: `${SOURCE_NAME}-fill`,
                        type: 'fill',
                        source: SOURCE_NAME,
                        'source-layer': SOURCE_NAME,
                        paint: {
                            'fill-color': '#2ecc71',
                            'fill-opacity': 0.5,
                        },
                    },
                    {
                        id: `${SOURCE_NAME}-outline`,
                        type: 'line',
                        source: SOURCE_NAME,
                        'source-layer': SOURCE_NAME,
                        paint: {
                            'line-color': '#27ae60',
                            'line-width': 1.5,
                        },
                    },
                ],
            },
            center: [0, 30],
            zoom: 3,
        });

        // ── SSE — live tile refresh ─────────────────────────────
        const statusEl = document.getElementById('sse-status');
        const eventsEl = document.getElementById('events');

        function addEventLog(msg) {
            const div = document.createElement('div');
            div.className = 'event';
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            eventsEl.prepend(div);
            // Keep last 10 events
            while (eventsEl.children.length > 10) {
                eventsEl.removeChild(eventsEl.lastChild);
            }
        }

        function refreshSource(sourceName) {
            const source = map.getSource(sourceName);
            if (!source) return;

            // Force MapLibre to re-fetch all visible tiles by
            // updating the tiles URL with a cache-busting parameter
            const ts = Date.now();
            source.setTiles([
                `${TILE_SERVER}/${sourceName}/{z}/{x}/{y}.pbf?_t=${ts}`
            ]);
            addEventLog(`Refreshed tiles for "${sourceName}"`);
        }

        // Subscribe with the current viewport, so the server only sends
        // updates that change tiles this map can see. The same calls work in
        // Mapbox GL JS (getBounds, getZoom, 'moveend').
        function eventsUrl() {
            const b = map.getBounds();
            const bbox = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()]
                .map((v) => v.toFixed(5))
                .join(',');
            const zoom = map.getZoom().toFixed(2);
            return `${TILE_SERVER}/events?bbox=${bbox}&zoom=${zoom}&source=${SOURCE_NAME}`;
        }

        let es = null;
        let retryTimer = null;

        function connectSSE() {
            clearTimeout(retryTimer);
            if (es) es.close();
            es = new EventSource(eventsUrl());
            const current = es;

            es.onopen = () => {
                statusEl.textContent = 'SSE: connected (this view only)';
                statusEl.className = 'connected';
            };

            es.addEventListener('update_complete', (e) => {
                const data = JSON.parse(e.data);
                addEventLog(
                    `Update in view: ${data.tiles_updated} tiles in "${data.source}" ` +
                    `(zooms ${data.affected_zooms.join(',')})`
                );
                refreshSource(data.source);
            });

            es.addEventListener('generate_complete', (e) => {
                const data = JSON.parse(e.data);
                addEventLog(
                    `Generate: "${data.source}" completed in ${data.duration_ms}ms`
                );
                refreshSource(data.source);
            });

            es.onerror = () => {
                if (current !== es) return; // superseded by a newer viewport
                statusEl.textContent = 'SSE: disconnected — retrying...';
                statusEl.className = 'disconnected';
                es.close();
                retryTimer = setTimeout(connectSSE, 3000);
            };
        }

        // Re-subscribe when the view settles (debounced). An update that lands
        // during the few milliseconds of reconnecting is not delivered.
        let moveTimer = null;
        map.on('moveend', () => {
            clearTimeout(moveTimer);
            moveTimer = setTimeout(connectSSE, 300);
        });

        map.on('load', () => {
            connectSSE();
            addEventLog('Connected to SSE — pan the map to change what is watched');
        });
    </script>
</body>
</html>
